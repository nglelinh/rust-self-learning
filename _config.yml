# Setup
title:               "Rust Programming Course"
description:         'Rust programming course for beginners. Learn Rust from scratch with practical examples and exercises.'
url:                 https://nglelinh.github.io
baseurl:             '/rust-self-learning'
imgurl:              https://nglelinh.github.io/rust-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Rust Programming Course"
    description: "Rust programming course for beginners. Learn Rust from scratch with practical examples and exercises."
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Khóa học lập trình Rust"
    description: "Khóa học lập trình Rust cho người mới bắt đầu. Học Rust từ cơ bản với các ví dụ và bài tập thực hành."
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Your Name
  email:             your.email@example.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.0.1
markdown: kramdown

# Analytics
google_analytics_id: ""
