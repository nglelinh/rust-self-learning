# Setup
title:               "Rust Programming: From Foundations to Systems Mastery"
description:         "A bilingual self-learning course on Rust systems programming. The English track is complete; Vietnamese is in progress, starting with Chapter 1."
url:                 https://nglelinh.github.io
baseurl:             '/rust-self-learning'
imgurl:              https://nglelinh.github.io/rust-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Rust Programming: From Foundations to Systems Mastery"
    description: "Learn Rust from foundations to systems mastery — ownership, concurrency, async, unsafe, and OS-level programming. English track complete; Vietnamese in progress."
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Lập trình Rust: Từ nền tảng đến thành thạo hệ thống"
    description: "Khóa tự học Rust — từ sở hữu bộ nhớ đến concurrency, async và lập trình hệ thống. Lộ trình tiếng Anh đã đầy đủ; tiếng Việt đang được xây dựng (đã có Chương 1)."
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Nguyen Le Linh
  email:             nglelinh@gmail.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.0.1
markdown: kramdown

# Analytics
google_analytics_id: ""
